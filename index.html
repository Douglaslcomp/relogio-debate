<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio do Debate</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <div class="tempos">
            <button class="tempo ativo" onclick="selecionarTempo(180, this)">3 minutos</button>
            <button class="tempo" onclick="selecionarTempo(120, this)">2 minutos</button>
            <button class="tempo" onclick="selecionarTempo(60, this)">1 minuto</button>
        </div>

        <section class="relogio">
            <h1>DEBATE ESCOLAR</h1>
            <p>TEMPO DE FALA</p>

            <div id="contador">03:00</div>

            <div class="barra">
                <div id="progresso"></div>
            </div>

            <p id="situacao">Pronto para iniciar</p>
        </section>

        <div class="controles">
            <button onclick="iniciar()">Iniciar</button>
            <button onclick="pausar()">Pausar</button>
            <button onclick="reiniciar()">Reiniciar</button>
            <button onclick="telaCheia()">Tela cheia</button>
        </div>
    </main>

</body>
</html>
